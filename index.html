<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. The Core PWA Link -->
    <link rel="manifest" href="/manifest.json">

    <!-- 2. Apple / iOS Safari Overrides -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Repton Hub">

    <!-- 3. Android / Chrome / Mobile Overrides -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">

    <!-- 4. Required Home Screen App Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">

    <title>Repton Student Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --accent: #2ecc71; 
            --navy: #040812; 
            --bg-glow: rgba(46, 204, 113, 0.03);
            --glass: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.08); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        .fas, .far { font-family: "Font Awesome 5 Free" !important; font-weight: 900 !important; }

        body.house-new { --accent: #2ecc71; --bg-glow: rgba(46, 204, 113, 0.04); }
        body.house-orchard { --accent: #CBC3E3; --bg-glow: rgba(203, 195, 227, 0.04); }
        body.house-latham { --accent: #3b82f6; --bg-glow: rgba(59, 130, 246, 0.04); }
        body.house-foremarke { --accent: #ef4444; --bg-glow: rgba(239, 68, 68, 0.04); }
        body.house-dahl { --accent: #38bdf8; --bg-glow: rgba(56, 189, 248, 0.04); }
        body.house-jumeirah { --accent: #cbd5e1; --bg-glow: rgba(203, 213, 225, 0.04); }
        body.house-school { --accent: #f59e0b; --bg-glow: rgba(245, 158, 11, 0.04); }

        body { 
            background: radial-gradient(circle at top, var(--bg-glow) 0%, var(--navy) 70%);
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 24px 16px; 
            min-height: 100vh; 
            transition: background 0.5s ease; 
            overflow-x: hidden; 
        }

        #login-screen, #settings-screen { 
            position: fixed; 
            inset: 0; 
            background: rgba(4, 8, 18, 0.92); 
            z-index: 2000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            animation: fadeIn 0.3s ease;
        }
        #settings-screen { display: none; overflow-y: auto; padding: 20px; flex-direction: column; }
        #hub-ui { display: none; width: 100%; max-width: 440px; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        .card { 
            background: var(--glass); 
            border-radius: 28px; 
            padding: 28px; 
            border: 1px solid var(--glass-border); 
            margin-bottom: 16px; 
            width: 100%; 
            border-bottom: 3px solid var(--accent); 
            position: relative; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .card:hover { border-color: rgba(255,255,255,0.15); }

        input, select { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            outline: none; 
            margin-bottom: 14px; 
            font-size: 15px; 
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.07); }
        select option { background: #0f172a; color: white; }

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; font-size: 14px; letter-spacing: 0.5px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #040812; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: rgba(255,255,255,0.06); color: white; border: 1px solid var(--glass-border); margin-top: 8px; }

        .day-selector { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .day-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.2s; }
        .day-btn.active { background: var(--accent); color: #040812; border-color: var(--accent); }

        .progress-bar { background: rgba(255,255,255,0.06); height: 8px; border-radius: 10px; margin: 18px 0 6px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.5s ease; border-radius: 10px; }

        .ending-soon { box-shadow: 0 0 25px var(--accent); border-color: var(--accent); }
        .ending-bar { background: linear-gradient(90deg, var(--accent), #ffffff); animation: pulse-bar 1s infinite; }
        @keyframes pulse-bar { 50% { opacity: 0.5; } }

        .tag { font-size: 11px; font-weight: 900; color: var(--accent); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .bat-critical { color: #ef4444 !important; animation: bat-pulse 1s infinite; }
        @keyframes bat-pulse { 50% { opacity: 0.3; } }

        .weather-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px !important;
            border-bottom: none !important;
        }

        .tt-input-group { margin-bottom: 14px; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }
        .tt-input-wrapper { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .tt-time-label { font-size: 11px; width: 65px; opacity: 0.4; font-weight: 700; }

        /* Homework styles */
        .hw-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .hw-item.completed span { text-decoration: line-through; opacity: 0.4; }
        
        /* Install Banner */
        #install-banner { display: none; position: fixed; bottom: 20px; left: 16px; right: 16px; max-width: 410px; margin: 0 auto; background: #0f172a; border: 1px solid var(--accent); z-index: 3000; padding: 16px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; justify-content: space-between; }
    </style>
</head>
<body id="app-body">

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="card" style="max-width: 360px; text-align: center; border-bottom: 3px solid var(--accent);">
            <div style="width: 64px; height: 64px; background: rgba(255,255,255,0.05); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; border: 1px solid var(--glass-border);">
                <i class="fas fa-shield-alt" style="font-size: 28px; color: var(--accent);"></i>
            </div>
            <h2 style="color: white; margin-bottom: 6px; font-weight: 800; font-size: 22px;">REPTON PORTAL</h2>
            <p style="font-size: 12px; opacity: 0.5; margin-bottom: 24px;">Enter your details to access your hub</p>
            <input type="text" id="username" placeholder="Full Name">
            <select id="house-select" onchange="previewHouse(this.value)">
                <option value="new">New House</option>
                <option value="orchard">Orchard House</option>
                <option value="latham">Latham House</option>
                <option value="foremarke">Foremarke House</option>
                <option value="dahl">Dahl House</option>
                <option value="jumeirah">Jumeirah House</option>
                <option value="school">School House</option>
            </select>
            <button class="btn btn-primary" onclick="handleLogin()">Enter Portal</button>
        </div>
    </div>

    <!-- SETTINGS / TIMETABLE EDITOR SCREEN -->
    <div id="settings-screen">
        <div class="card" style="max-width: 440px;">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin:0; font-size: 18px; font-weight: 800;">Timetable Editor</h3>
                <i class="fas fa-times" onclick="closeSettings()" style="cursor:pointer; opacity:0.5; font-size: 18px; padding: 5px;"></i>
            </div>

            <div class="day-selector">
                <button class="day-btn" id="d-btn-1" onclick="changeDay(1)">MON</button>
                <button class="day-btn" id="d-btn-2" onclick="changeDay(2)">TUE</button>
                <button class="day-btn" id="d-btn-3" onclick="changeDay(3)">WED</button>
                <button class="day-btn" id="d-btn-4" onclick="changeDay(4)">THU</button>
                <button class="day-btn" id="d-btn-5" onclick="changeDay(5)">FRI</button>
            </div>

            <div id="editor-grid" style="max-height: 40vh; overflow-y: auto; padding-right: 4px;"></div>

            <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 18px;">
                <p style="font-size: 11px; opacity: 0.5; margin-bottom: 8px; font-weight: 600;">House Theme</p>
                <select id="house-switch" onchange="previewHouse(this.value)" style="margin-bottom: 16px;">
                    <option value="new">New House</option>
                    <option value="orchard">Orchard House</option>
                    <option value="latham">Latham House</option>
                    <option value="foremarke">Foremarke House</option>
                    <option value="dahl">Dahl House</option>
                    <option value="jumeirah">Jumeirah House</option>
                    <option value="school">School House</option>
                </select>
                <button class="btn btn-primary" onclick="saveAll()">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <!-- MAIN HUB UI -->
    <div id="hub-ui">
        <div style="display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7; margin-bottom: 14px; font-weight: 800; padding: 0 4px;">
            <span><i class="far fa-clock" style="margin-right: 4px;"></i> <span id="clock">00:00</span></span>
            <span id="bat-container" style="display: flex; align-items: center; gap: 8px;">
                <span id="bat-pct">--%</span>
                <i id="bat-icon" class="fas fa-battery-full"></i>
            </span>
        </div>

        <!-- CURRENT LESSON CARD -->
        <div class="card" id="main-card">
            <span class="tag" id="house-tag">HOUSE</span>
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h2 id="greet" style="font-size: 24px; font-weight: 800;">Hello,</h2>
                <i class="fas fa-sliders-h" onclick="openSettings()" style="cursor:pointer; opacity: 0.4; font-size: 18px; transition: 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4"></i>
            </div>

            <div style="margin-top: 24px;">
                <div id="cur-lesson" style="font-size: 26px; font-weight: 900; margin: 4px 0; line-height: 1.15; letter-spacing: -0.5px;">--</div>
                <div id="cur-details" style="font-size: 13px; opacity: 0.6; font-weight: 600; margin-bottom: 4px;"></div>
                <div id="timer" style="font-size: 11px; font-weight: 800; opacity: 0.5; letter-spacing: 1px; margin-top: 6px;">STANDBY</div>
            </div>
            <div class="progress-bar"><div id="bar" class="progress-fill"></div></div>
        </div>

        <!-- WEATHER CARD -->
        <div class="card weather-card">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 36px; height: 36px; background: rgba(255,255,255,0.05); border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border);">
                    <i class="fas fa-map-marker-alt" style="color: var(--accent); font-size: 13px;"></i>
                </div>
                <div>
                    <div style="font-size: 12px; font-weight: 800; color: white;">Repton Dubai</div>
                    <div style="font-size: 10px; opacity: 0.4; font-weight: 600;">Live Weather</div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="w-icon-container" style="font-size: 22px; color: var(--accent);">
                    <i class="fas fa-sun" id="weather-icon"></i>
                </div>
                <h3 id="w-temp" style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px;">--°</h3>
            </div>
        </div>

        <!-- HOMEWORK & ASSIGNMENTS CARD -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span class="tag" style="margin: 0;">Assignments</span>
                <i class="fas fa-plus" onclick="promptAddHomework()" style="cursor: pointer; font-size: 14px; color: var(--accent);"></i>
            </div>
            <div id="homework-list">
                <p style="font-size: 12px; opacity: 0.4; text-align: center; padding: 10px 0;">No active homework. Tap + to add.</p>
            </div>
            <button class="btn btn-secondary" style="font-size: 12px; padding: 10px;" onclick="promptAddHomework()">+ Add Assignment</button>
        </div>
    </div>

    <!-- INSTALL PROMPT BANNER -->
    <div id="install-banner">
        <div>
            <div style="font-weight: 800; font-size: 14px; color: white;">Install Repton Hub</div>
            <div style="font-size: 11px; opacity: 0.6;">Add to home screen for offline access</div>
        </div>
        <button class="btn btn-primary" id="install-btn" style="width: auto; padding: 10px 16px; font-size: 12px;">Install</button>
    </div>

    <script>
        let userData = { name: "", house: "new", schedule: {1:{}, 2:{}, 3:{}, 4:{}, 5:{}}, homework: [] };
        let activeEditDay = 1;
        let deferredPrompt = null;

        const standardSlots = [
            { s: "07:40", e: "08:00", label: "Registration" },
            { s: "08:00", e: "09:00", label: "Lesson 1" },
            { s: "09:00", e: "10:00", label: "Lesson 2" },
            { s: "10:00", e: "10:20", label: "BREAK" },
            { s: "10:20", e: "11:20", label: "Lesson 3" },
            { s: "11:20", e: "12:20", label: "Lesson 4" },
            { s: "12:20", e: "13:00", label: "LUNCH" },
            { s: "13:00", e: "14:00", label: "Lesson 5" },
            { s: "14:00", e: "15:00", label: "Lesson 6" }
        ];

        const fridaySlots = [
            { s: "07:40", e: "08:00", label: "Registration" },
            { s: "08:00", e: "09:00", label: "Lesson 1" },
            { s: "09:00", e: "10:00", label: "Lesson 2" },
            { s: "10:00", e: "10:20", label: "BREAK" },
            { s: "10:20", e: "11:20", label: "Lesson 3" },
            { s: "11:20", e: "11:30", label: "Final Wrap" }
        ];

        function vibrate(ms = 15) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function previewHouse(h) { 
            document.body.className = `house-${h}`; 
            document.getElementById('house-select').value = h;
            document.getElementById('house-switch').value = h;
            vibrate(10);
        }

        function handleLogin() {
            const name = document.getElementById('username').value.trim();
            const house = document.getElementById('house-select').value;
            if(!name) return;
            vibrate(20);
            const saved = localStorage.getItem(`repton_v15_${name}`);
            userData = saved ? JSON.parse(saved) : { name, house, schedule: {1:{}, 2:{}, 3:{}, 4:{}, 5:{}}, homework: [] };
            userData.house = house;
            saveToStorage();
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('hub-ui').style.display = 'block';
            document.getElementById('house-tag').innerText = `${userData.house.toUpperCase()} HOUSE`;
            previewHouse(userData.house);
            renderHomework();
            start();
        }

        function openSettings() {
            vibrate(15);
            activeEditDay = new Date().getDay() || 1;
            if(activeEditDay > 5) activeEditDay = 1;
            renderEditor();
            document.getElementById('settings-screen').style.display = 'flex';
        }

        function closeSettings() { 
            vibrate(10);
            document.getElementById('settings-screen').style.display = 'none'; 
        }

        function changeDay(d) {
            saveInputs();
            activeEditDay = d;
            vibrate(10);
            renderEditor();
        }

        function renderEditor() {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`d-btn-${activeEditDay}`).classList.add('active');

            const grid = document.getElementById('editor-grid');
            const slots = (activeEditDay === 5) ? fridaySlots : standardSlots;
            const dayData = userData.schedule[activeEditDay] || {};

            grid.innerHTML = slots.map((s, i) => {
                const item = dayData[i] || { subject: '', teacher: '', room: '' };
                return `
                <div class="tt-input-group">
                    <div class="tt-input-wrapper">
                        <span class="tt-time-label">${s.s}</span>
                        <input class="tt-subj" data-idx="${i}" value="${item.subject || ''}" placeholder="${s.label}">
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <input class="tt-teach" data-idx="${i}" value="${item.teacher || ''}" placeholder="Teacher (e.g. Mr. Smith)" style="margin-bottom:0; font-size:13px; padding:10px;">
                        <input class="tt-room" data-idx="${i}" value="${item.room || ''}" placeholder="Room (e.g. R304)" style="margin-bottom:0; font-size:13px; padding:10px;">
                    </div>
                </div>`;
            }).join('');
        }

        function saveInputs() {
            const subjs = document.querySelectorAll('.tt-subj');
            const teachs = document.querySelectorAll('.tt-teach');
            const rooms = document.querySelectorAll('.tt-room');
            if(subjs.length) {
                const temp = {};
                subjs.forEach((inp, i) => {
                    temp[i] = {
                        subject: inp.value,
                        teacher: teachs[i].value,
                        room: rooms[i].value
                    };
                });
                userData.schedule[activeEditDay] = temp;
            }
        }

        function saveAll() {
            saveInputs();
            userData.house = document.getElementById('house-switch').value;
            saveToStorage();
            vibrate(30);
            location.reload();
        }

        function saveToStorage() { 
            localStorage.setItem(`repton_v15_${userData.name}`, JSON.stringify(userData)); 
            localStorage.setItem('last_v15', userData.name); 
        }

        // Homework functions
        function promptAddHomework() {
            vibrate(15);
            const title = prompt("Assignment / Homework title:");
            if(!title) return;
            const due = prompt("Due date (e.g., Tomorrow, Friday):", "Tomorrow");
            if(!userData.homework) userData.homework = [];
            userData.homework.push({ id: Date.now(), title, due, completed: false });
            saveToStorage();
            renderHomework();
        }

        function toggleHomework(id) {
            vibrate(15);
            const item = userData.homework.find(h => h.id === id);
            if(item) {
                item.completed = !item.completed;
                saveToStorage();
                renderHomework();
            }
        }

        function deleteHomework(id) {
            vibrate(15);
            userData.homework = userData.homework.filter(h => h.id !== id);
            saveToStorage();
            renderHomework();
        }

        function renderHomework() {
            const container = document.getElementById('homework-list');
            if(!userData.homework || userData.homework.length === 0) {
                container.innerHTML = `<p style="font-size: 12px; opacity: 0.4; text-align: center; padding: 10px 0;">No active homework. Tap + to add.</p>`;
                return;
            }
            container.innerHTML = userData.homework.map(h => `
                <div class="hw-item ${h.completed ? 'completed' : ''}">
                    <div style="display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1;" onclick="toggleHomework(${h.id})">
                        <i class="far ${h.completed ? 'fa-check-square' : 'fa-square'}" style="color: var(--accent); font-size: 16px;"></i>
                        <div>
                            <span style="font-size: 13px; font-weight: 700; color: white; display: block;">${h.title}</span>
                            <span style="font-size: 10px; opacity: 0.5;">Due: ${h.due}</span>
                        </div>
                    </div>
                    <i class="fas fa-trash-alt" onclick="deleteHomework(${h.id})" style="font-size: 12px; opacity: 0.3; cursor: pointer; padding: 6px;"></i>
                </div>
            `).join('');
        }

        function updateBattery(b) {
            const pct = Math.round(b.level * 100);
            const icon = document.getElementById('bat-icon');
            document.getElementById('bat-pct').innerText = pct + "%";
            icon.className = 'fas ';
            icon.classList.remove('bat-critical');
            if(b.charging) { icon.classList.add('fa-bolt'); icon.style.color = 'var(--accent)'; }
            else {
                icon.style.color = '#f8fafc';
                if(pct > 85) icon.classList.add('fa-battery-full');
                else if(pct > 65) icon.classList.add('fa-battery-three-quarters');
                else if(pct > 35) icon.classList.add('fa-battery-half');
                else if(pct > 15) icon.classList.add('fa-battery-quarter');
                else { icon.classList.add('fa-battery-empty'); icon.classList.add('bat-critical'); }
            }
        }

        function getWeatherIconClass(code) {
            if (code === 0) return 'fa-sun';
            if (code >= 1 && code <= 3) return 'fa-cloud-sun';
            if (code === 45 || code === 48) return 'fa-smog';
            if (code >= 51 && code <= 67) return 'fa-cloud-rain';
            if (code >= 71 && code <= 77) return 'fa-snowflake';
            if (code >= 80 && code <= 82) return 'fa-cloud-showers-heavy';
            if (code >= 95 && code <= 99) return 'fa-bolt';
            return 'fa-cloud';
        }

        function tick() {
            const now = new Date();
            const day = now.getDay();
            const mins = now.getHours() * 60 + now.getMinutes();
            const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('clock').innerText = timeStr;
            document.getElementById('greet').innerText = `Hey, ${userData.name.split(' ')[0]}`;

            let lesson = "Day Over", details = "", prog = 0, msg = "RELAX";
            let isEnding = false;

            if(day >= 1 && day <= 5) {
                const slots = (day === 5) ? fridaySlots : standardSlots;
                const endLimit = (day === 5) ? 690 : 900;

                slots.forEach((s, i) => {
                    const sM = parseInt(s.s.split(':')[0])*60 + parseInt(s.s.split(':')[1]);
                    const eM = parseInt(s.e.split(':')[0])*60 + parseInt(s.e.split(':')[1]);
                    if(mins >= sM && mins < eM) {
                        const custom = userData.schedule[day] && userData.schedule[day][i];
                        lesson = (custom && custom.subject) ? custom.subject : s.label;
                        
                        if (custom && (custom.teacher || custom.room)) {
                            details = `${custom.teacher ? custom.teacher : ''} ${custom.room ? '• ' + custom.room : ''}`;
                        } else {
                            details = `${s.s} – ${s.e}`;
                        }

                        prog = ((mins - sM) / (eM - sM)) * 100;
                        let rem = eM - mins;
                        msg = `${rem}m REMAINING`;
                        if(rem <= 5) isEnding = true;

                        // Dynamic tab title update for lock screen / tab inspection
                        document.title = `(${rem}m) Repton Portal`;
                    }
                });
                if(mins >= endLimit) { lesson = "Dismissed"; details = "School's out"; msg = "GO HOME"; document.title = "Repton Portal"; }
            } else {
                document.title = "Repton Portal";
            }

            document.getElementById('cur-lesson').innerText = lesson;
            document.getElementById('cur-details').innerText = details;
            const bar = document.getElementById('bar');
            bar.style.width = prog + "%";

            const card = document.getElementById('main-card');
            if(isEnding) {
                card.classList.add('ending-soon');
                bar.classList.add('ending-bar');
            } else {
                card.classList.remove('ending-soon');
                bar.classList.remove('ending-bar');
            }

            document.getElementById('timer').innerText = msg;
        }

        async function start() {
            setInterval(tick, 1000);
            tick();
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.14&longitude=55.37&current=temperature_2m,weather_code&timezone=auto');
                const d = await res.json();
                document.getElementById('w-temp').innerText = Math.round(d.current.temperature_2m) + "°";
                const iconClass = getWeatherIconClass(d.current.weather_code);
                document.getElementById('weather-icon').className = `fas ${iconClass}`;
            } catch(e) {}

            if(navigator.getBattery) {
                const b = await navigator.getBattery();
                if (document.fonts) { await document.fonts.ready; updateBattery(b); }
                b.onlevelchange = () => updateBattery(b);
                b.onchargingchange = () => updateBattery(b);
            }

            // Register Service Worker for offline PWA capabilities
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.catch.js').catch(() => {});
            }
        }

        // PWA Install prompt handler
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'flex';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if(deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if(outcome === 'accepted') {
                    document.getElementById('install-banner').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.onload = () => {
            const last = localStorage.getItem('last_v15');
            if(last) {
                const saved = localStorage.getItem(`repton_v15_${last}`);
                if(saved) { userData = JSON.parse(saved); handleLogin(); }
            }
        }
    </script>
</body>
</html>
